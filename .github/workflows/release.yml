name: release

on:
  push:
    tags:
      - v*

jobs:
  build-android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: write gkd keystore
        run: echo ${{ secrets.GKD_STORE_FILE_BASE64 }} | base64 --decode > ${{ github.workspace }}/gkd.jks

      - name: write play keystore
        run: echo ${{ secrets.PLAY_STORE_FILE_BASE64 }} | base64 --decode > ${{ github.workspace }}/play.jks

      - run: ./gradlew :gkd-android:assembleGkdRelease :gkd-android:bundlePlayRelease
        env:
          GKD_GITHUB_COOKIE: ${{ secrets.GKD_GITHUB_COOKIE }}
          GKD_API_AUTH_TOKEN: ${{ secrets.GKD_API_AUTH_TOKEN }}
          GKD_STORE_FILE: ${{ github.workspace }}/gkd.jks
          GKD_STORE_PASSWORD: ${{ secrets.GKD_STORE_PASSWORD }}
          GKD_KEY_ALIAS: ${{ secrets.GKD_KEY_ALIAS }}
          GKD_KEY_PASSWORD: ${{ secrets.GKD_KEY_PASSWORD }}
          PLAY_STORE_FILE: ${{ github.workspace }}/play.jks
          PLAY_STORE_PASSWORD: ${{ secrets.PLAY_STORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: gkd-apk
          path: gkd-android/build/outputs/apk/gkd/release

      - uses: actions/upload-artifact@v7
        with:
          name: gkd-play-aab
          path: gkd-android/build/outputs/bundle/playRelease

      - uses: actions/upload-artifact@v7
        with:
          name: gkd-${{ github.ref_name }}.outputs
          path: gkd-android/build/outputs

      - run: |
          cp outputs/apk/gkd/release/*.apk "${GITHUB_WORKSPACE}/gkd-${GITHUB_REF_NAME}.apk"
          zip -r "${GITHUB_WORKSPACE}/gkd-${GITHUB_REF_NAME}.outputs.zip" outputs
        working-directory: gkd-android/build

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body_path: ./CHANGELOG.md
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          fail_on_unmatched_files: true
          files: |
            gkd-*.apk
            gkd-v*.outputs.zip

  build-windows:
    needs: build-android
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: build Windows portable package
        run: ./gradlew.bat :gkd-app:packageWindowsPortable
        env:
          GKD_RENAME_PACKAGE_FLAG: "1"

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          include-hidden-files: true
          if-no-files-found: error
          path: .local/desktop-packages/gkd-v*.win-*.zip

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: .local/desktop-packages/gkd-v*.win-*.zip
