name: Build-Apk

on:
  workflow_dispatch:

  push:
    branches:
      - '**'
    paths-ignore:
      - 'LICENSE'
      - '*.md'
      - '.github/**'

jobs:
  build:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore:') && !startsWith(github.event.head_commit.message, 'chore(') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_ENCRYPTION_KEY }}

      - name: write gkd keystore
        run: echo ${{ secrets.GKD_STORE_FILE_BASE64 }} | base64 --decode > ${{ github.workspace }}/gkd.jks

      - run: chmod 777 ./gradlew
      - run: ./gradlew app:assembleGkdRelease
        env:
          GKD_GITHUB_COOKIE: ${{ secrets.GKD_GITHUB_COOKIE }}
          GKD_API_AUTH_TOKEN: ${{ secrets.GKD_API_AUTH_TOKEN }}
          GKD_STORE_FILE: ${{ github.workspace }}/gkd.jks
          GKD_STORE_PASSWORD: ${{ secrets.GKD_STORE_PASSWORD }}
          GKD_KEY_ALIAS: ${{ secrets.GKD_KEY_ALIAS }}
          GKD_KEY_PASSWORD: ${{ secrets.GKD_KEY_PASSWORD }}
          GKD_RENAME_APK_FLAG: "1"

      - uses: actions/upload-artifact@v7
        with:
          archive: false
          path: app/build/outputs/apk/gkd/release/*.apk

      - uses: actions/upload-artifact@v7
        with:
          name: outputs
          path: app/build/outputs
