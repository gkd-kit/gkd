name: 错误反馈 / Bug report
title: "[BUG] "
description: 反馈你遇到的错误 / Report the bug you encountered
labels: ["pending triage"]

body:
  - type: markdown
    attributes:
      value: |
        ## 感谢您花时间填写，在提交问题之前，请确保您完成以下操作
        1. 请 **确保** 您已经查阅了 [GKD 官方文档](https://gkd.li) 以及 [常见问题](https://gkd.li/guide/faq)
        2. 请 **判断** 是不是第三方规则订阅的问题，如果是，你应该向规则提供者反馈，而不是在这里提交，**此处只接受 GKD 应用本体的问题**
        3. 请 **确保** 已有的 [问题](https://github.com/gkd-kit/gkd/issues?q=is%3Aissue) 或 [讨论](https://github.com/orgs/gkd-kit/discussions?discussions_q=) 中没有人提交过相似问题，否则请在该问题下进行讨论
        4. 请 **确保** 你的问题能在 [releases](https://github.com/gkd-kit/gkd/releases/latest) 发布的最新版本(包含测试版本)上复现 (如果不是请先更新到最新版本复现后再提交问题)
        5. 如果使用了 **HMA-OSS、隐藏应用列表（Hide My Applist）、非残（IAmNotDisabled）、XPrivacyLua** 等会隐藏应用信息、隐藏无障碍状态或修改系统接口返回结果的模块，请先禁用相关模块并重启设备，再运行诊断、复现问题。这类模块可能干扰 GKD 的正常工作。若禁用后问题消失，请检查模块配置及作用范围；若仍能复现，请提交禁用后采集的日志。
  - type: textarea
    id: log-file
    attributes:
      label: |
        完整日志 ZIP 或日志链接
      description: |
        在 **首页 → 设置 → 关于 → 日志** 中导出日志，将 GKD 生成的 **完整 `.zip` 压缩包** 直接上传到下方。也可以选择 **生成链接**，将日志链接粘贴到下方。

        **请勿解压 ZIP 后单独上传 `.log` 文件，也不要只粘贴日志片段。** 排查问题需要结合压缩包里的多份信息，单个文件可能缺少关键线索。

        如果遇到无法识别界面、界面记录显示错误、规则不触发或无法点击等问题，可以先进入 **首页 → 设置 → 诊断**，启动诊断后复现问题，再停止诊断并导出日志。请尽量在问题发生后立即停止，并在 BUG 描述中注明复现操作、目标应用和大致发生时间。

        任何问题都需要提供日志文件，请不要只提供文字、截图或视频。
    validations:
      required: true
  - type: textarea
    id: module-environment
    attributes:
      label: 模块环境与排查结果
      description: |
        如果使用了相关模块，请填写模块名称、版本、作用范围，以及禁用模块并重启后是否仍能复现；未使用请填写“未使用”。
      placeholder: |
        示例：HMA-OSS，版本 xxx，对微信启用了隐藏无障碍相关设置；禁用模块并重启后，问题消失。
    validations:
      required: true
  - type: textarea
    id: bug-1
    attributes:
      label: |
        BUG描述(文字/截图/视频)
      description: |
        请使用尽量准确的描述，否则你的问题将会被直接关闭\
        另外如果你的问题是关于快照/选择器的，请必须提供快照链接或者快照文件，否则你的问题将会被直接关闭
    validations:
      required: true
  - type: textarea
    id: bug-2
    attributes:
      label: |
        期望行为(文字/截图/视频)
      description: |
        请使用尽量准确的描述，否则你的问题将会被直接关闭
    validations:
      required: true
  - type: textarea
    id: bug-3
    attributes:
      label: |
        实际行为(文字/截图/视频)
      description: |
        请使用尽量准确的描述，否则你的问题将会被直接关闭
    validations:
      required: true
